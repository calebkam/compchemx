<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-brand="platform">CompChemX</title>
<link rel="icon" href="shared/favicon.svg?v=0.5.2" type="image/svg+xml">
<meta name="description" content="CompChemX: browser-based tools for drawing molecules and docking them to proteins. Everything runs locally in your browser.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="shared/theme.js?v=0.5.2"></script>
<script src="shared/brand.js?v=0.5.2"></script>
<script src="shared/versions.js?v=0.5.2"></script>
<meta name="color-scheme" content="dark light">
<style>
:root{
  --bg:#1A1918; --panel:#232220; --paper:#2B2926; --line:#3A3835; --fg:#ECE8E1; --muted:#9A958B;
  --accent:#D97757; --accent-soft:rgba(217,119,87,.16); --accent-fg:#1F0E07; color-scheme:dark;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#F0EEE6; --panel:#FAF9F5; --paper:#FFFFFF; --line:#DDD9CC; --fg:#1F1E1D; --muted:#6B665C;
  --accent:#C15F3C; --accent-soft:rgba(193,95,60,.12); --accent-fg:#FFFFFF; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--ui);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 56px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:9px;font-weight:600}
.mark svg{width:24px;height:24px;color:var(--accent)}
.theme{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;color:inherit;font:inherit;font-size:13px}
.theme:hover{border-color:var(--muted)}
.hero{padding:52px 0 34px}
.hero h1{margin:0 0 12px;font-size:clamp(28px,4.2vw,56px);line-height:1.12;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.hl{color:var(--accent)}
.ver{font:500 11.5px/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:4px 8px;margin-left:4px}
.hero p{margin:0;color:var(--muted);font-size:clamp(16px,1.5vw,20px)}
h2{margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grp+.grp{margin-top:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.card .ic svg{width:24px;height:24px}
.card h3{margin:0;font-size:18px;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;font:12px var(--mono);color:var(--muted)}
.chip{padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font:500 11px var(--mono)}
.chip.stable{background:rgba(94,170,121,.16);color:#6DBE8A}
:root[data-theme="light"] .chip.stable{background:rgba(31,122,61,.12);color:#1F7A3D}
.chip.off{background:rgba(230,180,60,.16);color:#E6B43C}
:root[data-theme="light"] .chip.off{background:rgba(170,120,0,.13);color:#8A6200}
.card.soon{border-style:dashed;background:transparent}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:6px 18px;flex-wrap:wrap}
code{font:12.5px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><path d="M12 3v6M4.2 16.5L9.4 13.5M19.8 16.5L14.6 13.5" stroke-width="1.4"/></svg><span data-brand="platform">CompChemX</span> <span class="ver" id="site-ver"></span></div>
    <button class="theme" id="theme" type="button">Light mode</button>
  </header>

  <section class="hero">
    <h1>Chemistry tools that run in <span class="hl">your browser.</span></h1>
    <p>Draw molecules, build them in 3D and dock them to proteins. No install, no server, and nothing you enter leaves your machine.</p>
  </section>

  <div id="groups"></div>
  <footer>
    <span><a href="changelog/">Changelog and References</a></span>
    <span>MIT License &copy; 2026 Caleb Kam</span>
  </footer>
</div>
<script>
/* Add a tool: append one object to TOOLS. group decides the heading it appears under. */
const GROUPS = [
  { id: 'gen', title: 'General Chemistry' },
  { id: 'comp', title: 'Computational Chemistry' },
  { id: 'nmr', title: 'NMR' }
];
const TOOLS = [
  { group: 'gen', name: cpName('draw'), href: 'draw/', icon: 'pen', tag: 'Draw',
    text: 'A 2D chemical structure editor. Draw rings, chains, charges and stereochemistry, get IUPAC names offline, copy or paste SMILES and see the structure in 3D.' },
  { group: 'comp', name: cpName('dock'), href: 'dock/', icon: 'dock', tag: 'Build and dock',
    text: 'Convert a drawing to 3D, minimise its energy, define a binding pocket on a PDB structure and dock it. Poses, images, drug-likeness and kcal/mol or kJ/mol.' },
  { group: 'comp', name: cpName('md'), icon: 'md', tag: '', text: '' },
  { group: 'nmr', name: cpName('nmr'), href: 'nmr/', icon: 'nmr', tag: 'Predict spectra',
    text: 'Draw a molecule and see its predicted 1H and 13C NMR spectrum: shifts, multiplets, integrals and DEPT-135, at the field strength you choose.' },
  { group: 'nmr', name: cpName('nmrread'), href: 'nmrread/', icon: 'nmrread', tag: 'Read FIDs', status: 'Beta',
    text: 'Open a Bruker or JCAMP-DX FID, process it (Fourier transform, phasing, baseline, referencing) and export a publication-ready spectrum as SVG or PNG.' },
  { group: 'gen', name: cpName('shape'), href: 'shape/', icon: 'shape', tag: 'Lewis and VSEPR', status: 'Beta',
    text: 'Draw a molecule and get its Lewis structure with resonance forms, VSEPR geometry and shape, polarity, and a 3D view showing lone pairs, bonds and pi electron clouds.' }
];
const ICONS = {
  pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/>',
  nmr: '<path d="M2 18h3l2-1 2 1 2-12 2 14 2-9 1.5 7H22"/>',
  nmrread: '<path d="M3 20h18"/><path d="M5 20c0-6 1-9 2-9s1 5 2 5 1-12 3-12 1 14 3 14 1-6 2-6 1 3 1 8"/>',
  shape: '<path d="M12 3l8 5v8l-8 5-8-5V8z"/><path d="M12 3v18M4 8l16 8M20 8L4 16"/>',
  md: '<circle cx="6" cy="7" r="2.2"/><circle cx="17" cy="6" r="2.2"/><circle cx="12" cy="17" r="2.2"/><path d="M8 7.5l7-1M7 9l4 6.5M16 8l-3 7.5"/>',
  dock: '<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.6"/>'
};
const groups = document.getElementById('groups');
for (const g of GROUPS) {
  const items = TOOLS.filter(t => t.group === g.id); if (!items.length) continue;
  const sec = document.createElement('section'); sec.className = 'grp'; sec.innerHTML = '<h2></h2><div class="cards"></div>'; sec.querySelector('h2').textContent = g.title;
  const box = sec.querySelector('.cards');
  for (const t of items) {
    const live = !!t.href, el = document.createElement(live ? 'a' : 'div'); el.className = 'card' + (live ? '' : ' soon'); if (live) el.href = t.href;
    const svg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[t.icon] || ICONS.dock) + '</svg>';
    el.innerHTML = '<div class="ic">' + svg + '</div><h3></h3><p></p><div class="foot"><span></span><span class="chip"></span></div>';
    el.querySelector('h3').textContent = t.name; el.querySelector('p').textContent = t.text; el.querySelector('.foot span').textContent = t.tag;
    const chip = el.querySelector('.chip'); chip.textContent = live ? (t.status || 'Stable') : 'Coming Soon'; if (!live) chip.classList.add('off'); else if ((t.status || 'Stable') === 'Stable') chip.classList.add('stable'); box.append(el);
  }
  groups.append(sec);
}
const sv = (window.CP_VERSIONS || {}).site; if (sv) document.getElementById('site-ver').textContent = window.cpVer(sv); else document.getElementById('site-ver').remove();
/* If shared/theme.js did not load (for example the shared folder was not uploaded), fall back to a local copy of its logic so this page still works. */
if (!window.CPTheme) {
  const R = document.documentElement, K = 'cp-theme', read = () => { try { const v = localStorage.getItem(K); return v === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } };
  R.dataset.theme = read();
  window.CPTheme = { get: () => R.dataset.theme, set(v) { R.dataset.theme = v; try { localStorage.setItem(K, v); } catch (e) {} window.dispatchEvent(new Event('cp-theme')); }, toggle() { this.set(this.get() === 'dark' ? 'light' : 'dark'); } };
  console.warn('shared/theme.js did not load: check that the shared folder is in the repo root.');
}
const themeBtn = document.getElementById('theme');
const syncTheme = () => { const dark = window.CPTheme.get() === 'dark'; themeBtn.textContent = dark ? 'Light mode' : 'Dark mode'; themeBtn.title = dark ? 'Switch to light mode' : 'Switch to dark mode'; };
themeBtn.addEventListener('click', () => window.CPTheme.toggle());
window.addEventListener('cp-theme', syncTheme); syncTheme();
</script>
</body>
</html>
